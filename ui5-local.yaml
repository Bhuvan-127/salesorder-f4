# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: salesorder
type: application
framework:
  name: SAPUI5
  version: 1.148.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true # CRITICAL for bypassing local proxy cert errors
        backend:
          # 1. On-Premise Proxy via CF Approuter
          - path: /sap
            url: https://org-build-stefbuildjs-build-sales-order-ui-approuter.cfapps.us10-001.hana.ondemand.com/
          
          # 2. Direct proxy to your personal Trial CAPM service
          - path: /sales-order
            url: https://org-build-stefbuildjs-build-salesorder-capm-srv.cfapps.us10-001.hana.ondemand.com
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sales-order
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
        annotations: []
